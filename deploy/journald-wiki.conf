# Cap the journal so logs do not fill, or wear out, the SD card (brainstorm 5.17).
# The app logs JSON lines to standard output only; journald collects them.
#
# Install (as root):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo install -m 644 deploy/journald-wiki.conf /etc/systemd/journald.conf.d/wiki.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage            # check
#
# For logs that never touch the card, use Storage=volatile instead (they are
# kept in memory and lost at reboot) and drop SystemMaxUse.

[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=500M
MaxRetentionSec=1month
